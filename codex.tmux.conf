# Minimal tmux config for codex sessions.
# Includes mouse clipboard bindings for easier copy/paste.
set -g status off
set -g mouse on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title:RGB,screen*:title:RGB,rxvt*:ignorefkeys,*:RGB"
set -g update-environment "COLORTERM DISPLAY SSH_AUTH_SOCK SSH_AGENT_PID SSH_CLIENT SSH_CONNECTION SSH_TTY TERM_PROGRAM TERM_PROGRAM_VERSION XAUTHORITY WAYLAND_DISPLAY"
set -g destroy-unattached off
bind -T prefix d detach-client

# Copy selection to the system clipboard when mouse selection ends.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "$HOME/src/codex-tools/tmux-copy-clipboard.sh"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "$HOME/src/codex-tools/tmux-copy-clipboard.sh"
set -g allow-rename off
set -g base-index 1
setw -g aggressive-resize on
set -s escape-time 50
